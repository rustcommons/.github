<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Rust Commons crab and crate</title>
  <desc id="description">A symmetric rust-orange crab with raised open claws, six legs, dark eyes, and a cube-shaped shell divided by transparent seams.</desc>
  <defs>
    <g id="left-side" fill="#d95519">
      <!-- Open pincer and its bent arm. -->
      <path d="M 153,276 C 115,263 87,239 78,207 C 66,160 104,111 163,96
               C 178,92 190,95 183,102 C 155,119 131,139 118,162
               L 123,182 C 145,169 162,151 176,135
               C 183,127 188,131 186,145 C 182,182 163,209 130,220
               L 122,223 L 125,237 L 147,225 L 169,244 Z"/>
      <!-- Three separated legs, shaped to stay inside a circular avatar. -->
      <path d="M 153,290 L 110,271 Q 101,267 95,275
               Q 76,299 68,329 Q 66,340 74,332
               L 105,305 L 151,320 Z"/>
      <path d="M 165,332 L 117,321 Q 108,319 102,328
               L 85,359 Q 81,367 86,380 L 100,408
               Q 105,418 107,405 L 111,371 L 135,348 L 178,350 Z"/>
      <path d="M 187,367 L 149,374 Q 141,376 137,384
               L 122,411 Q 119,418 125,425 L 147,446
               Q 155,453 154,441 L 153,419 L 171,396 L 206,385 Z"/>
      <!-- Eye stalk, dark eye and a restrained highlight. -->
      <path d="M 189,260 L 182,224 Q 179,205 195,201
               Q 211,199 214,217 L 217,249 Z"/>
      <circle cx="196" cy="216" r="18" fill="#252b2d"/>
      <circle cx="190" cy="210" r="5" fill="#fff"/>
    </g>
  </defs>
  <use href="#left-side"/>
  <use href="#left-side" transform="translate(512 0) scale(-1 1)"/>
  <!-- Crate top and front faces; the background shows through every seam. -->
  <g fill="#d95519">
    <path d="M 256,235 L 348,279 L 256,323 L 164,279 Z"/>
    <path d="M 156,290 L 250,335 L 250,411
             C 220,398 185,382 168,356 Q 156,338 156,315 Z"/>
    <path d="M 356,290 L 262,335 L 262,411
             C 292,398 327,382 344,356 Q 356,338 356,315 Z"/>
  </g>
</svg>
